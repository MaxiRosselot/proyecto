[build]
  command = "npm run build"
  publish = "dist"
  functions = "netlify/functions"

# Páginas estáticas que no deben ir al SPA
[[redirects]]
  from = "/confirm.html"
  to = "/confirm.html"
  status = 200

# URL linda sin .html (opcional)
[[redirects]]
  from = "/confirm"
  to = "/confirm.html"
  status = 200

# Link de pago de cada cotizacion (Mercado Pago): https://<sitio>/pagar?c=<N°>&t=<firma>
[[redirects]]
  from = "/pagar"
  to = "/.netlify/functions/pagar"
  status = 200

# Panel admin — todas las subrutas van al SPA (que detecta /admin)
[[redirects]]
  from = "/admin/*"
  to = "/index.html"
  status = 200

[[redirects]]
  from = "/admin"
  to = "/index.html"
  status = 200

# Catch-all del SPA (al final)
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[functions]
  node_bundler = "esbuild"
  external_node_modules = ["googleapis"]

# Los externos del bloque [functions] se copian en TODAS las funciones; pdfkit
# solo lo usa generate-quote y agregarlo arriba deja a read-pdf-quote sobre los
# 250 MB descomprimidos que acepta AWS Lambda.
# ponytail: googleapis completo (~207 MB) va en cada función; generate-quote queda
# en ~247 MB. Si otra dependencia la empuja al límite, cambiar googleapis por
# @googleapis/sheets, @googleapis/drive y @googleapis/calendar.
[functions.generate-quote]
  external_node_modules = ["pdfkit"]
  included_files = ["netlify/functions/quote-assets/**"]

# La cotizacion que arma el cliente en /cotiza genera el mismo PDF: mismas dependencias y el
# mismo tamaño que generate-quote (ver el limite de arriba).
[functions.cotizacion-web]
  external_node_modules = ["pdfkit"]
  included_files = ["netlify/functions/quote-assets/**"]

[functions.send-reminders]
  schedule = "0 13 * * *"

# Seguimiento de las 20:00 en Chile (correos a cotizaciones sin respuesta y Telegram con las
# instalaciones de mañana). Corre a las 23 y 00 UTC y solo actua la que cae a las 20 h en Chile.
[functions.seguimiento-diario]
  schedule = "0 23,0 * * *"

# Fichas del dia al maestro y resumen a Maxi por Telegram a las 07:00 de Chile (10 y 11 UTC; actua
# la que cae a las 7 h en Chile).
[functions.bot-manana]
  schedule = "0 10,11 * * *"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Frame-Options = "DENY"
    Permissions-Policy = "geolocation=()"
